<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a" />
      <stop offset="50%" stop-color="#0f1118" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Subtle Blueprint Grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="550" x2="1200" y2="550" />
    <circle cx="80" cy="80" r="4" fill="#fbbf24" />
    <circle cx="1120" cy="80" r="4" fill="#fbbf24" />
    <circle cx="80" cy="550" r="4" fill="#fbbf24" />
    <circle cx="1120" cy="550" r="4" fill="#fbbf24" />
  </g>

  <!-- Content Container -->
  <g transform="translate(100, 110)">
    <!-- Header Tag / Kicker -->
    <rect x="0" y="0" width="310" height="34" rx="17" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="17" r="4" fill="#fbbf24" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#fbbf24">EXECUTIVE DOSSIER · B2B SALES</text>

    <!-- Name Heading -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5" fill="#ffffff">
      Naresh Singh Bhau
    </text>

    <!-- Subtitle / Role -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" letter-spacing="0.2" fill="#a1a1aa">
      Regional Manager &amp; Revenue Leader · Regional P&amp;L &amp; Enterprise Growth
    </text>

    <!-- Narrative bio snippet -->
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#71717a">
      8+ years scaling MSME &amp; corporate sales organizations across North India.
    </text>

    <!-- Stat Metrics Row -->
    <g transform="translate(0, 240)">
      <!-- Card 1: Revenue -->
      <rect x="0" y="0" width="220" height="110" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="url(#card-border)" stroke-width="1" />
      <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#a1a1aa">MONTHLY P&amp;L</text>
      <text x="24" y="82" font-family="monospace, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#fbbf24">₹3Cr+</text>

      <!-- Card 2: Headcount -->
      <rect x="240" y="0" width="220" height="110" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="url(#card-border)" stroke-width="1" />
      <text x="264" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#a1a1aa">SALES TEAM</text>
      <text x="264" y="82" font-family="monospace, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff">50+ Org</text>

      <!-- Card 3: Max Deal -->
      <rect x="480" y="0" width="220" height="110" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="url(#card-border)" stroke-width="1" />
      <text x="504" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#a1a1aa">TOP CONTRACT</text>
      <text x="504" y="82" font-family="monospace, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#38bdf8">₹94 Lakh</text>

      <!-- Card 4: YoY Growth -->
      <rect x="720" y="0" width="220" height="110" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="url(#card-border)" stroke-width="1" />
      <text x="744" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#a1a1aa">EXPANSION RATE</text>
      <text x="744" y="82" font-family="monospace, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#34d399">18%+ YoY</text>
    </g>

    <!-- Footer URL -->
    <g transform="translate(0, 390)">
      <text x="0" y="0" font-family="monospace, sans-serif" font-size="14" font-weight="600" fill="#a1a1aa" letter-spacing="1">
        nareshbhau1993@gmail.com · Jaipur, India · IndiaMART InterMESH Ltd.
      </text>
    </g>
  </g>
</svg>
