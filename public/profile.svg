<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e2430" />
      <stop offset="60%" stop-color="#0c0e12" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c24" />
      <stop offset="100%" stop-color="#0e1014" />
    </linearGradient>
    <linearGradient id="lapelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3242" />
      <stop offset="100%" stop-color="#13161d" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="30%" y1="20%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#d99f73" />
      <stop offset="60%" stop-color="#c48557" />
      <stop offset="100%" stop-color="#9a5e35" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Ambient Rim Light -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="url(#amberGlow)" stroke-width="2" opacity="0.4" />

  <!-- Torso / Tailored Jacket -->
  <path d="M 90 400 L 130 290 L 170 270 L 230 270 L 270 290 L 310 400 Z" fill="url(#suitGrad)" />
  
  <!-- White Dress Shirt V -->
  <polygon points="175,270 225,270 200,345" fill="#f8fafc" />
  
  <!-- Subtle Tie / Accent -->
  <polygon points="195,300 205,300 207,385 200,400 193,385" fill="#0f172a" />

  <!-- Suit Lapels -->
  <polygon points="130,290 175,270 190,360 150,380" fill="url(#lapelGrad)" />
  <polygon points="270,290 225,270 210,360 250,380" fill="url(#lapelGrad)" />

  <!-- Neck -->
  <rect x="180" y="220" width="40" height="60" rx="8" fill="#b8784d" />

  <!-- Head Base -->
  <ellipse cx="200" cy="185" rx="55" ry="68" fill="url(#skinGrad)" />

  <!-- Clean Executive Haircut -->
  <path d="M 140 180 C 138 120, 160 100, 200 98 C 240 100, 262 120, 260 180 C 255 130, 235 115, 200 115 C 165 115, 145 130, 140 180 Z" fill="#121316" />

  <!-- Ears -->
  <ellipse cx="142" cy="188" rx="8" ry="14" fill="#bd7c4e" />
  <ellipse cx="258" cy="188" rx="8" ry="14" fill="#aa6b3f" />

  <!-- Subtle Eyes & Eyebrows -->
  <path d="M 165 168 Q 178 164 190 168" stroke="#1f242d" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M 210 168 Q 222 164 235 168" stroke="#1f242d" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <ellipse cx="178" cy="178" rx="4" ry="4.5" fill="#1e2229" />
  <ellipse cx="222" cy="178" rx="4" ry="4.5" fill="#1e2229" />
  <circle cx="179" cy="176" r="1.5" fill="#ffffff" />
  <circle cx="223" cy="176" r="1.5" fill="#ffffff" />

  <!-- Nose -->
  <path d="M 197 182 L 202 198 L 194 204" stroke="#a36237" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Well Groomed Beard / Stubble -->
  <path d="M 160 200 C 165 240, 235 240, 240 200 C 235 248, 165 248, 160 200 Z" fill="#1a1c22" opacity="0.35" />

  <!-- Confident Smile -->
  <path d="M 184 216 Q 200 225 216 216" stroke="#874723" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Monogram Watermark / Pin -->
  <g transform="translate(138, 335)">
    <rect width="24" height="24" rx="6" fill="#f59e0b" />
    <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#000" text-anchor="middle">NB</text>
  </g>
</svg>
